<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan B Campus Cash ⚡</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #2d2d30; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); max-width: 520px; width: 100%; text-align: center; }
    h1 { color: #f7931a; margin-bottom: 20px; }
    h3 { margin-bottom: 16px; line-height: 1.5; }
    .screen { display: none; }
    .screen.active { display: block; }
    .score-bar { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #aaa; }
    .score-bar span { color: #f7931a; font-weight: bold; font-size: 16px; }
    .btn-option { display: block; width: 100%; padding: 14px; margin: 8px 0; background: #444; border: none; color: white; border-radius: 8px; cursor: pointer; font-size: 15px; transition: 0.2s; text-align: left; }
    .btn-option:hover:not(:disabled) { background: #f7931a; color: #1a1a1d; font-weight: bold; }
    .btn-option.correct { background: #28a745 !important; color: white; font-weight: bold; }
    .btn-option.wrong { background: #dc3545 !important; color: white; }
    .btn-option:disabled { cursor: not-allowed; opacity: 0.8; }
    #feedback { margin-top: 14px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; }
    #feedback.correct { background: rgba(40,167,69,0.2); color: #28a745; border: 1px solid #28a745; }
    #feedback.wrong { background: rgba(220,53,69,0.2); color: #dc3545; border: 1px solid #dc3545; }
    .btn-primary { background: #f7931a; color: #1a1a1d; font-weight: bold; padding: 14px 28px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 16px; width: 100%; transition: 0.2s; }
    .btn-primary:hover { background: #e6820f; }
    .btn-secondary { background: #555; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 12px; width: 100%; transition: 0.2s; display: none; }
    .btn-secondary:hover { background: #f7931a; color: #1a1a1d; }
    input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #555; background: #111; color: white; font-size: 15px; margin-bottom: 12px; }
    input[type="text"]:focus { outline: none; border-color: #f7931a; }
    .score-display { font-size: 48px; font-weight: bold; color: #f7931a; margin: 20px 0 8px; }
    .score-label { color: #aaa; margin-bottom: 20px; }
    .sats-display { background: #222; border: 2px solid #f7931a; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .sats-display .amount { font-size: 32px; font-weight: bold; color: #f7931a; }
    #error-msg { color: #dc3545; font-size: 14px; margin-top: 8px; min-height: 20px; }
    #payment-status { margin-top: 14px; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ Campus Cash Quiz</h1>

  <div id="screen-start" class="screen active">
    <p style="color:#aaa; margin-bottom:20px;">Answer 5 Bitcoin questions and earn sats!<br>One attempt per day per Lightning Address.</p>
    <input type="text" id="input-address" placeholder="your@lightningaddress.com" />
    <p id="error-msg"></p>
    <button class="btn-primary" onclick="startQuiz()">Start Quiz ⚡</button>
  </div>

  <div id="screen-quiz" class="screen">
    <div class="score-bar">
      <span id="question-counter">Question 1 / 5</span>
      <span>Score: <span id="score-live">0</span></span>
    </div>
    <h3 id="question-text"></h3>
    <div id="options-container"></div>
    <div id="feedback"></div>
    <button class="btn-secondary" id="btn-next" onclick="nextQuestion()">Next question ➡️</button>
  </div>

  <div id="screen-result" class="screen">
    <h3 style="color:#f7931a;">Quiz Complete! 🎉</h3>
    <div class="score-display" id="final-score-display">0/5</div>
    <p class="score-label">correct answers</p>
    <div class="sats-display">
      <p style="color:#aaa; margin-bottom:4px;">Sats earned</p>
      <div class="amount" id="sats-earned-display">0 sats</div>
    </div>
    <p id="payment-status">⏳ Sending your sats...</p>
  </div>
</div>

<script>
  let questions = [];
  let currentIndex = 0;
  let score = 0;
  let lightningAddress = '';

  async function startQuiz() {
    const input = document.getElementById('input-address');
    const errorMsg = document.getElementById('error-msg');
    lightningAddress = input.value.trim();
    errorMsg.innerText = '';

    if (!lightningAddress.includes('@') || !lightningAddress.includes('.')) {
      errorMsg.innerText = '⚠️ Please enter a valid Lightning Address (e.g. name@domain.com)';
      return;
    }

    const btn = document.querySelector('#screen-start .btn-primary');
    btn.innerText = 'Loading...';
    btn.disabled = true;

    try {
      const response = await fetch('http://localhost:3000/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lightningAddress })
      });

      const data = await response.json();

      if (!response.ok) {
        errorMsg.innerText = '❌ ' + data.errore;
        btn.innerText = 'Start Quiz ⚡';
        btn.disabled = false;
        return;
      }

      questions = data.questions;
      currentIndex = 0;
      score = 0;
      showScreen('screen-quiz');
      loadQuestion();

    } catch (err) {
      errorMsg.innerText = '❌ Connection error. Is the server running?';
      btn.innerText = 'Start Quiz ⚡';
      btn.disabled = false;
    }
  }

  function loadQuestion() {
    const q = questions[currentIndex];
    document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} / ${questions.length}`;
    document.getElementById('score-live').innerText = score;
    document.getElementById('question-text').innerText = q.testoDomanda;
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.opzioni.forEach(option => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerText = option;
      btn.onclick = () => answerQuestion(btn, option, q.rispostaEsatta, q.spiegazione);
      container.appendChild(btn);
    });
  }

  function answerQuestion(clickedBtn, chosen, correct, explanation) {
    document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);

    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';

    if (chosen === correct) {
      score++;
      clickedBtn.classList.add('correct');
      feedback.className = 'correct';
      feedback.innerText = '✅ Correct! ' + (explanation || '');
    } else {
      clickedBtn.classList.add('wrong');
      document.querySelectorAll('.btn-option').forEach(b => {
        if (b.innerText === correct) b.classList.add('correct');
      });
      feedback.className = 'wrong';
      feedback.innerText = '❌ Wrong! Correct answer: ' + correct + (explanation ? ' — ' + explanation : '');
    }

    document.getElementById('score-live').innerText = score;

    const btnNext = document.getElementById('btn-next');
    if (currentIndex >= questions.length - 1) {
      btnNext.innerText = 'See Results 🏆';
      btnNext.onclick = showResults;
    } else {
      btnNext.innerText = 'Next question ➡️';
      btnNext.onclick = nextQuestion;
    }
    btnNext.style.display = 'block';
  }

  function nextQuestion() {
    currentIndex++;
    loadQuestion();
  }

  async function showResults() {
    showScreen('screen-result');
    const total = questions.length;
    document.getElementById('final-score-display').innerText = score + '/' + total;
    document.getElementById('sats-earned-display').innerText = score + ' sat' + (score !== 1 ? 's' : '');

    const statusEl = document.getElementById('payment-status');

    try {
      const response = await fetch('http://localhost:3000/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lightningAddress, score, total })
      });

      const data = await response.json();

      if (response.ok && data.successo) {
        statusEl.style.color = '#28a745';
        statusEl.innerText = '✅ ' + data.messaggio;
      } else {
        statusEl.style.color = '#dc3545';
        statusEl.innerText = '❌ ' + (data.errore || 'Payment error');
      }
    } catch (err) {
      statusEl.style.color = '#dc3545';
      statusEl.innerText = '❌ Connection error during payment.';
    }
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
