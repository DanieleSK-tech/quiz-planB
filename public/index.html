<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan B Campus Cash ⚡</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1d; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .quiz-container { background: #2d2d30; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); max-width: 500px; width: 100%; text-align: center; }
    h1 { color: #f7931a; margin-top: 0; }
    .btn-opzione { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #444; border: none; color: white; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; }
    .btn-opzione:hover { background: #f7931a; color: #1a1a1d; font-weight: bold; }
    
    /* Sezione pagamento nascosta all'inizio */
    #sezione-pagamento { display: none; margin-top: 20px; background: #222; padding: 20px; border-radius: 8px; border: 2px solid #f7931a; }
    input[type="text"] { width: 90%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #555; background: #111; color: white; }
    #btn-paga { background: #f7931a; color: #1a1a1d; font-weight: bold; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; }
    
    #messaggio { margin-top: 15px; font-weight: bold; }
    .esatta { background: #28a745 !important; }
    .sbagliata { background: #dc3545 !important; }
  </style>
</head>
<body>

  <div class="quiz-container">
    <h1>⚡ Campus Cash Quiz</h1>
    
    <!-- Qui apparirà la domanda -->
    <h3 id="testo-domanda">Caricamento domanda...</h3>
    <div id="contenitore-opzioni"></div>
<!-- MANCAVA — riga dopo i bottoni opzioni -->
<p id="messaggio"></p>

<!-- MANCAVA — bottone per andare alla domanda successiva -->
<button id="btn-prossima" onclick="caricaDomanda()" style="display:none">➡️ Prossima domanda</button>
    <!-- Sezione che appare solo se si vince -->
    <!-- Sezione che appare solo se si vince -->
<div id="sezione-pagamento">
  <h3 style="color: #28a745;">🎉 Esatto! Hai vinto 1 sat!</h3>
  <p>Inserisci il tuo <strong>Lightning Address</strong> per ricevere i satoshi:</p>
  <input type="text" id="input-fattura" placeholder="nome@dominio.com">
  <button id="btn-paga" onclick="pagaVincitore()">Invia i miei Satoshi!</button>
  <p id="stato-pagamento"></p>
</div>

  <script>
    let rispostaCorrettaCorrente = "";

    // 1. CARICAMENTO DELLA DOMANDA DAL SERVER
    async function caricaDomanda() {
      document.getElementById('sezione-pagamento').style.display = 'none';
      document.getElementById('messaggio').innerText = '';
      document.getElementById('btn-prossima').style.display = 'none';
      document.getElementById('contenitore-opzioni').innerHTML = '';
      document.getElementById('testo-domanda').innerText = 'Caricamento domanda...';

      try {
        // Chiamiamo la rotta GET del nostro server Node.js
        const response = await fetch('http://localhost:3000/api/domanda');
        const domanda = await response.json();

        document.getElementById('testo-domanda').innerText = domanda.testoDomanda;
        rispostaCorrettaCorrente = domanda.rispostaEsatta;

        // Creiamo i bottoni per ogni opzione mescolata
        domanda.opzioni.forEach(opzione => {
          const btn = document.createElement('button');
          btn.className = 'btn-opzione';
          btn.innerText = opzione;
          btn.onclick = () => verificaRisposta(btn, opzione);
          document.getElementById('contenitore-opzioni').appendChild(btn);
        });

      } catch (error) {
        document.getElementById('testo-domanda').innerText = 'Errore di connessione al server.';
      }
    }

    // 2. VERIFICA DELLA RISPOSTA CLICCATA
    function verificaRisposta(bottoneCliccato, testoScelto) {
      // Disabilitiamo tutti i bottoni per impedire doppi click
      const tuttiIBottoni = document.querySelectorAll('.btn-opzione');
      tuttiIBottoni.forEach(b => b.disabled = true);

      if (testoScelto === rispostaCorrettaCorrente) {
        bottoneCliccato.classList.add('esatta');
        document.getElementById('sezione-pagamento').style.display = 'block';
        document.getElementById('messaggio').innerText = '';
      } else {
        bottoneCliccato.classList.add('sbagliata');
        document.getElementById('messaggio').innerText = 'Sbagliato! La risposta era: ' + rispostaCorrettaCorrente;
        document.getElementById('messaggio').style.color = '#dc3545';
        document.getElementById('btn-prossima').style.display = 'inline-block';
      }
    }

    // 3. PAGAMENTO DELLA FATTURA TRAMITE IL SERVER
    async function pagaVincitore() {
  const lightningAddress = document.getElementById('input-fattura').value.trim();
  const statoTesto = document.getElementById('stato-pagamento');

  // Validazione: controlla che sia un formato tipo nome@dominio.com
  if (!lightningAddress.includes('@') || !lightningAddress.includes('.')) {
    statoTesto.innerText = '⚠️ Inserisci un Lightning Address valido (es. nome@dominio.com)';
    statoTesto.style.color = 'red';
    return;
  }

  statoTesto.innerText = '⏳ Pagamento in corso, attendere...';
  statoTesto.style.color = 'white';

  try {
    const response = await fetch('http://localhost:3000/api/paga', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lightningAddress: lightningAddress })
    });

    const risultato = await response.json();

    if (response.ok && risultato.successo) {
      statoTesto.innerText = '✅ ' + risultato.messaggio;
      statoTesto.style.color = '#28a745';
      document.getElementById('btn-prossima').style.display = 'inline-block';
    } else {
      statoTesto.innerText = '❌ ' + risultato.errore;
      statoTesto.style.color = '#dc3545';
    }
  } catch (error) {
    statoTesto.innerText = '❌ Errore di comunicazione col server.';
  }
}

    // Carica la prima domanda all'avvio della pagina
    window.onload = caricaDomanda;
  </script>

</body>
</html>
